name: Scheduled messages
run-name: ${{ inputs.function || github.event.schedule || github.workflow }}

# Posts the bot's messages to your chat on the weekly schedule in
# gamedaybot/espn/github_actions.py (Central time for most posts, Eastern for game-time posts).
#
# Main trigger: an outside timer (cron-job.org) starts this workflow at each post time with
# one of the slot names below (fetti_report, tuesday_evening, wednesday_morning,
# thursday_matchups), because GitHub's own schedules are often hours late or skipped.
#
# Backup: GitHub's schedule below. It's in UTC, so each slot appears twice (daylight and
# standard time); the copy that doesn't match the current clock does nothing. Each backup run
# starts 20 minutes early and waits until the post time. If the timer already posted a slot,
# the backup skips it, and vice versa, so nothing is posted twice.
# If you change the schedule, regenerate this list with:
#   python -m gamedaybot.espn.github_actions --print-crons

on:
  schedule:
    - cron: '10 0 * * 3'
    - cron: '10 12 * * 3'
    - cron: '10 13 * * 3'
    - cron: '10 21 * * 4'
    - cron: '10 22 * * 4'
    - cron: '10 23 * * 2'
    - cron: '11 12 * * 0,1,2,4,5,6'
    - cron: '11 13 * * 0,1,2,4,5,6'
    - cron: '40 16 * * 2'
    - cron: '40 17 * * 2'
  workflow_dispatch:
    inputs:
      function:
        description: Message to post right now
        required: true
        type: choice
        options:
          - fetti_report
          - tuesday_evening
          - wednesday_morning
          - thursday_matchups
          - get_standings
          - get_matchups
          - get_power_rankings
          - get_final
          - get_trophies
          - get_luck_report
          - get_form_report
          - get_strength_of_schedule
          - get_clown_watch
          - get_waiver_report
          - win_matrix
          - trophy_recap

permissions:
  actions: read
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Required (Settings > Secrets and variables > Actions > Secrets)
      BOT_ID: ${{ secrets.BOT_ID }}
      LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
      # Needed for private leagues and the waiver report
      SWID: ${{ secrets.SWID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      # Optional (Settings > Secrets and variables > Actions > Variables)
      LEAGUE_YEAR: ${{ vars.LEAGUE_YEAR }}
      START_DATE: ${{ vars.START_DATE }}
      END_DATE: ${{ vars.END_DATE }}
      DAILY_WAIVER: ${{ vars.DAILY_WAIVER }}
      TOP_HALF_SCORING: ${{ vars.TOP_HALF_SCORING }}
      RANDOM_PHRASE: ${{ vars.RANDOM_PHRASE }}
      TIMEZONE: America/Winnipeg
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post scheduled messages
        if: github.event_name == 'schedule'
        run: python -m gamedaybot.espn.github_actions "${{ github.event.schedule }}"

      - name: Post selected message
        if: github.event_name == 'workflow_dispatch'
        run: python -m gamedaybot.espn.github_actions --run "${{ inputs.function }}"
